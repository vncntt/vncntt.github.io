baseURL = 'https://vincent-cheng.com'
languageCode = 'en-us'
title = 'Vincent Cheng'
theme = "paper"

[pagination]
  pagerSize = 100

# Add this menu section
[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  # Add more buttons as needed, for example:
  [[menu.main]]
    identifier = "now"
    name = "Now"
    url = "/now/"
    weight = 30

[params]
  customCSS = ["css/custom.css"]
  
  # Enable math typesetting
  math = true
  
  # Add KaTeX support
  katex = true
  
  # Empty mainSections means nothing shows on homepage
  # mainSections = ["about"]

  twitter = 'vvvincent_c'
  github = 'vncntt'
  
  # SEO and metadata
  description = "Vincent Cheng's personal website: notes and projects on mathematics, machine learning, AI safety, and learning."
  author = "Vincent Cheng"
  keywords = ["Vincent Cheng", "UCSD", "Cornell", "Math-CS", "Atlas Fellow", "Ross", "WARP", "IOAI", "ML", "AI"]

  images = ["/headshot.jpg"]
  ogImage = "/headshot.jpg"

[permalinks]
  notes = "/:contentbasename/"

[module]
  [[module.imports]]
    path = "github.com/nanxiaobei/hugo-paper"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
